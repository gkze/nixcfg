---
name: Update runtime
description: Pin the updater and tools to this checkout for one disposable job.
inputs:
  github-token:
    description: Token for public upstream API requests
    required: true
  cachix-token:
    description: Cachix upload credential (empty uses the cache read-only)
    required: false
  cache-generators:
    description: Restore generator downloads for preparation or repair
    default: "false"
outputs:
  runtime:
    description: Pinned nixcfg package
    value: ${{ steps.runtime.outputs.runtime }}
  devshell:
    description: Pinned development environment
    value: ${{ steps.runtime.outputs.devshell }}
runs:
  using: composite
  steps:
    - name: Reclaim unused hosted image tools
      shell: python
      env:
        NIXCFG_CI_STAGE: clean-image
      run: |
        import runpy
        runpy.run_path("lib/update/ci/jobs.py", run_name="__main__")
    # Determinate Nix v3.22.5
    - uses: DeterminateSystems/determinate-nix-action@8d87e8d5e5b8a8309d4281094560f127d9a265f1
      with:
        github-token: ${{ inputs.github-token }}
        extra-conf: |
          max-jobs = 2
          cores = 2
          min-free = 1073741824
          max-free = 4294967296
    - uses: cachix/cachix-action@3ba601ff5bbb07c7220846facfa2cd81eeee15a1 # v16
      with:
        name: gkze
        extraPullNames: zed
        authToken: ${{ inputs.cachix-token }}
        useDaemon: true
    - name: Restore generator downloads and verified receipts
      if: inputs.cache-generators == 'true'
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: |
          ~/.cache/nixcfg/crate2nix-cargo-home/registry
          ~/.cache/nixcfg/crate2nix-cargo-home/git
          ~/.cache/nixcfg/generation-receipts
        key: |-
          ${{ format('nixcfg-gen-v1-{0}-{1}-{2}-{3}-{4}',
          runner.os, runner.arch, github.run_id, github.run_attempt, github.job) }}
        restore-keys: |
          nixcfg-gen-v1-${{ runner.os }}-${{ runner.arch }}-
    - name: Build pinned runtime
      id: runtime
      shell: python
      run: |
        import runpy
        runpy.run_path("lib/update/ci/jobs.py", run_name="__main__")
      env:
        NIXCFG_CI_STAGE: bootstrap
