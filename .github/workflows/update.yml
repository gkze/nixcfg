---
name: Update
on:
  workflow_dispatch:
    inputs:
      targets:
        description: Space-separated targets (empty updates all eligible targets)
        type: string
        default: ""
      validate_all_packages:
        description: Validate all declared packages (required for repaired candidates)
        type: boolean
        default: false
      repair:
        description: Allow one agent repair and a fresh fully validated attempt
        type: boolean
        default: true
  schedule:
    - cron: "17 7 * * 1"
  # workflow_dispatch is unavailable to the Cursor GitHub App token
  # (HTTP 403, missing actions:write). Touching .github/update-kick on
  # main or a listed feature branch queues one Update run. Prefer
  # `gh workflow run` when the App has Actions write.
  push:
    branches:
      - main
      - cursor/no-skip-darwin-shards-6614
    paths:
      - .github/update-kick
permissions:
  contents: read
concurrency:
  group: nixcfg-update-${{ github.ref }}
  # Keep overlapping default-branch runs. Feature-branch exercise runs cancel
  # so a newer HEAD can start instead of waiting on a doomed older SHA.
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}
jobs:
  # Generated artifacts can be shared between platforms. Extend one pinned
  # candidate serially. Linux builds the VM dependencies before Darwin roots.
  prepare-darwin:
    uses: ./.github/workflows/update-native.yml
    with:
      runner: macos-15
      system: aarch64-darwin
      stage: prepare
      targets: ${{ inputs.targets || '' }}
      # workflow_dispatch inputs are unset on push/schedule. A kick-file
      # push must match EM's dispatch: repair (job if) + validate_all.
      validate_all_packages: |-
        ${{ github.event_name == 'push' ||
        inputs.validate_all_packages || false }}
    secrets: inherit
  prepare-arm:
    needs: prepare-darwin
    uses: ./.github/workflows/update-native.yml
    with:
      runner: ubuntu-24.04-arm
      system: aarch64-linux
      stage: prepare
      previous: prepare-aarch64-darwin
    secrets: inherit
  prepare-x86:
    needs: prepare-arm
    uses: ./.github/workflows/update-native.yml
    with:
      runner: ubuntu-24.04
      system: x86_64-linux
      stage: prepare
      previous: prepare-aarch64-linux
    secrets: inherit
  # Flake.lock freezes after prepare-darwin. Cache the Linux native boundary
  # of Darwin roots (the Rosetta/linux-builder VM image) here so Darwin
  # closures can start with Darwin packages instead of waiting for Linux
  # package validation. These jobs are not publication evidence.
  cache-darwin-linux-deps-arm:
    needs: prepare-darwin
    uses: ./.github/workflows/update-native.yml
    with:
      runner: ubuntu-24.04-arm
      system: aarch64-linux
      stage: cache-root-deps
      previous: prepare-aarch64-darwin
    secrets: inherit
  cache-darwin-linux-deps-x86:
    needs: prepare-darwin
    uses: ./.github/workflows/update-native.yml
    with:
      runner: ubuntu-24.04
      system: x86_64-linux
      stage: cache-root-deps
      previous: prepare-aarch64-darwin
    secrets: inherit
  validate-arm:
    needs: prepare-x86
    uses: ./.github/workflows/update-native.yml
    with:
      runner: ubuntu-24.04-arm
      system: aarch64-linux
      stage: validate
      previous: prepare-x86_64-linux
    secrets: inherit
  validate-x86:
    needs: prepare-x86
    uses: ./.github/workflows/update-native.yml
    with:
      runner: ubuntu-24.04
      system: x86_64-linux
      stage: validate
      previous: prepare-x86_64-linux
    secrets: inherit
  # rust_* warmup owns all 5 public macos-15 slots, striped across the
  # planner's crate2nix dependency layers. Packages inventory waits so it
  # does not steal a slot. Each slot skip-if-in-gkze resumes. Root shards
  # still build full closures after this job succeeds; the 400-local-drv
  # gate is unchanged.
  validate-darwin-warm-rust:
    needs:
      - prepare-x86
      - plan-darwin-closures
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        slot: [0, 1, 2, 3, 4]
    uses: ./.github/workflows/update-native.yml
    with:
      runner: macos-15
      system: aarch64-darwin
      stage: validate
      previous: prepare-x86_64-linux
      scope: rust-warmup
      shard: rust-${{ matrix.slot }}
      warmup_artifact: plan-shards-x86_64-linux
      warmup_slot: ${{ matrix.slot }}
    secrets: inherit
  # Package inventory is certify evidence. It no longer serializes the
  # 3755-path root warmup; that set is the rust-warmup matrix above.
  validate-darwin-packages:
    needs:
      - prepare-x86
      - plan-darwin-closures
      - validate-darwin-warm-rust
    uses: ./.github/workflows/update-native.yml
    with:
      runner: macos-15
      system: aarch64-darwin
      stage: validate
      previous: prepare-x86_64-linux
      scope: packages
    secrets: inherit
  # One generated matrix from lib.rootClosureManifest plus shard_costs.json.
  # The plan job evaluates the candidate tree, not a hand-maintained host list.
  plan-darwin-closures:
    needs: prepare-x86
    uses: ./.github/workflows/update-native.yml
    with:
      runner: ubuntu-24.04
      system: x86_64-linux
      stage: plan-shards
      previous: prepare-x86_64-linux
    secrets: inherit
  # Always-run per-root Darwin shards. The if: only skips when a required
  # input job failed; a planned shard cannot skip on the success path.
  # rust-warmup is a success gate so shards start from a pushed rust_* set.
  validate-darwin-roots:
    needs:
      - plan-darwin-closures
      - prepare-x86
      - cache-darwin-linux-deps-arm
      - cache-darwin-linux-deps-x86
      - validate-darwin-warm-rust
    if: |-
      always() && !cancelled() &&
      needs.plan-darwin-closures.result == 'success' &&
      needs.prepare-x86.result == 'success' &&
      needs.cache-darwin-linux-deps-arm.result == 'success' &&
      needs.cache-darwin-linux-deps-x86.result == 'success' &&
      needs.validate-darwin-warm-rust.result == 'success'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan-darwin-closures.outputs.darwin_closure_shards) }}
    uses: ./.github/workflows/update-native.yml
    with:
      runner: macos-15
      system: aarch64-darwin
      stage: validate
      previous: prepare-x86_64-linux
      scope: closure-shard
      closure_budget_seconds: "18000"
      closure_roots: ${{ matrix.roots }}
      shard: ${{ matrix.shard }}
    secrets: inherit
  # Aggregate proof. Mostly substitution of the per-root checks.
  validate-darwin-closures:
    needs:
      - prepare-x86
      - cache-darwin-linux-deps-arm
      - cache-darwin-linux-deps-x86
      - validate-darwin-roots
    if: |-
      always() && !cancelled() &&
      needs.prepare-x86.result == 'success' &&
      needs.cache-darwin-linux-deps-arm.result == 'success' &&
      needs.cache-darwin-linux-deps-x86.result == 'success' &&
      needs.validate-darwin-roots.result == 'success'
    uses: ./.github/workflows/update-native.yml
    with:
      runner: macos-15
      system: aarch64-darwin
      stage: validate
      previous: prepare-x86_64-linux
      scope: closures
      closure_budget_seconds: "18000"
    secrets: inherit
  # Fail closed: every manifest root valid and present in gkze.cachix.org,
  # every planned shard ran, Linux + Darwin package inventories intact.
  # Job results are checked first. Root outPaths come from the
  # plan-darwin-closures artifact, not a second Darwin eval.
  assert-coverage:
    needs:
      - prepare-x86
      - plan-darwin-closures
      - validate-arm
      - validate-x86
      - validate-darwin-warm-rust
      - validate-darwin-packages
      - validate-darwin-roots
      - validate-darwin-closures
    if: always()
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/update-runtime
        id: runtime
        with:
          github-token: ${{ secrets.UPDATE_SELF_HEAL_GITHUB_TOKEN }}
          cachix-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: prepare-x86_64-linux
          path: ${{ runner.temp }}/previous
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: ${{ runner.temp }}/evidence
      - name: Assert root and package coverage
        env:
          NIXCFG_RUNTIME: ${{ steps.runtime.outputs.runtime }}
          NIXCFG_DEVSHELL: ${{ steps.runtime.outputs.devshell }}
          NIXCFG_CI_STAGE: assert-coverage
          NIXCFG_PREVIOUS_CANDIDATE: ${{ runner.temp }}/previous/candidate.json
          NIXCFG_COVERAGE_EVIDENCE: ${{ runner.temp }}/evidence
          NIXCFG_JOB_RESULTS: |-
            plan-darwin-closures=${{ needs.plan-darwin-closures.result }}
            validate-arm=${{ needs.validate-arm.result }}
            validate-x86=${{ needs.validate-x86.result }}
            validate-darwin-warm-rust=${{ needs.validate-darwin-warm-rust.result }}
            validate-darwin-packages=${{ needs.validate-darwin-packages.result }}
            validate-darwin-roots=${{ needs.validate-darwin-roots.result }}
            validate-darwin-closures=${{ needs.validate-darwin-closures.result }}
        run: |
          import runpy
          runpy.run_path("lib/update/ci/jobs.py", run_name="__main__")
        shell: python
      - name: Flush Cachix daemon
        if: always()
        env:
          NIXCFG_CI_STAGE: flush-cachix
        run: |
          import runpy
          runpy.run_path("lib/update/ci/jobs.py", run_name="__main__")
        shell: python
  publish:
    needs:
      - validate-arm
      - validate-x86
      - validate-darwin-warm-rust
      - validate-darwin-packages
      - validate-darwin-roots
      - validate-darwin-closures
      - assert-coverage
    if: |-
      always() && !cancelled() &&
      needs.validate-arm.result == 'success' &&
      needs.validate-x86.result == 'success' &&
      needs.validate-darwin-warm-rust.result == 'success' &&
      needs.validate-darwin-packages.result == 'success' &&
      needs.validate-darwin-roots.result == 'success' &&
      needs.validate-darwin-closures.result == 'success' &&
      needs.assert-coverage.result == 'success'
    # The Python suite and its 100% coverage floor are maintained on Darwin.
    runs-on: macos-15
    timeout-minutes: 120
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/update-runtime
        id: runtime
        with:
          github-token: ${{ secrets.UPDATE_SELF_HEAL_GITHUB_TOKEN }}
          cachix-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: ${{ runner.temp }}/evidence
      - name: Certify and check final tree
        id: candidate
        env:
          NIXCFG_RUNTIME: ${{ steps.runtime.outputs.runtime }}
          NIXCFG_DEVSHELL: ${{ steps.runtime.outputs.devshell }}
          NIXCFG_CI_STAGE: certify
        run: |
          import runpy
          runpy.run_path("lib/update/ci/jobs.py", run_name="__main__")
        shell: python
      - uses: crazy-max/ghaction-import-gpg@e89d40939c28e39f97cf32126055eeae86ba74ec # v6
        if: steps.candidate.outputs.changed == 'true'
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true
      - name: Propose validated update
        if: steps.candidate.outputs.changed == 'true'
        env:
          NIXCFG_DEVSHELL: ${{ steps.runtime.outputs.devshell }}
          # The dedicated update PAT is rejected by Git (empty or expired).
          # This job already has contents:write and pull-requests:write.
          GH_TOKEN: ${{ github.token }}
          UPDATE_BASE_BRANCH: ${{ github.event.repository.default_branch }}
          NIXCFG_CI_STAGE: publish
        run: |
          import runpy
          runpy.run_path("lib/update/ci/jobs.py", run_name="__main__")
        shell: python
      - name: Flush Cachix daemon
        if: always()
        env:
          NIXCFG_CI_STAGE: flush-cachix
        run: |
          import runpy
          runpy.run_path("lib/update/ci/jobs.py", run_name="__main__")
        shell: python
  repair:
    needs:
      - prepare-darwin
      - prepare-arm
      - prepare-x86
      - cache-darwin-linux-deps-arm
      - cache-darwin-linux-deps-x86
      - validate-arm
      - validate-x86
      - validate-darwin-warm-rust
      - validate-darwin-packages
      - plan-darwin-closures
      - validate-darwin-roots
      - validate-darwin-closures
      - assert-coverage
      - publish
    if: |-
      always() && !cancelled() && contains(needs.*.result, 'failure') &&
      (github.event_name == 'schedule' || github.event_name == 'push' ||
      inputs.repair == true || inputs.repair == 'true')
    # The repair gate runs the Darwin-maintained Python suite, as publish does.
    runs-on: macos-15
    timeout-minutes: 120
    permissions:
      actions: write
      contents: write
      copilot-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/update-runtime
        id: runtime
        with:
          github-token: ${{ secrets.UPDATE_SELF_HEAL_GITHUB_TOKEN }}
          cachix-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          cache-generators: "true"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: ${{ runner.temp }}/repair-evidence
      - name: Collect failed job logs
        env:
          GH_TOKEN: ${{ github.token }}
          NIXCFG_CI_STAGE: collect-evidence
        run: |
          import runpy
          runpy.run_path("lib/update/ci/jobs.py", run_name="__main__")
        shell: python
      - name: Install bounded repair agent
        run: |
          import runpy
          runpy.run_path("lib/update/ci/jobs.py", run_name="__main__")
        shell: python
        env:
          NIXCFG_CI_STAGE: install-agent
      - name: Propose one repair
        env:
          NIXCFG_RUNTIME: ${{ steps.runtime.outputs.runtime }}
          NIXCFG_DEVSHELL: ${{ steps.runtime.outputs.devshell }}
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_MODEL: gpt-6-astra
          COPILOT_AUTO_UPDATE: 'false'
          NIXCFG_CI_STAGE: repair
        run: |
          import runpy
          runpy.run_path("lib/update/ci/jobs.py", run_name="__main__")
        shell: python
      - name: Retain repair evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: repair
          path: |
            ${{ runner.temp }}/repair.patch
            ${{ runner.temp }}/repair-evidence/repair.log
          if-no-files-found: warn
          overwrite: true
          retention-days: 30
      - uses: crazy-max/ghaction-import-gpg@e89d40939c28e39f97cf32126055eeae86ba74ec # v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true
      - name: Start a fresh attempt with repair disabled
        env:
          NIXCFG_DEVSHELL: ${{ steps.runtime.outputs.devshell }}
          GH_TOKEN: ${{ github.token }}
          NIXCFG_CI_STAGE: start-repair
          NIXCFG_UPDATE_TARGETS: ${{ inputs.targets || '' }}
        run: |
          import runpy
          runpy.run_path("lib/update/ci/jobs.py", run_name="__main__")
        shell: python
      - name: Flush Cachix daemon
        if: always()
        env:
          NIXCFG_CI_STAGE: flush-cachix
        run: |
          import runpy
          runpy.run_path("lib/update/ci/jobs.py", run_name="__main__")
        shell: python
