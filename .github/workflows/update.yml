  repair:
    needs:
      - prepare-pins
      - prepare-darwin
      - prepare-arm
      - prepare-x86
      - prepare-merge
      - cache-darwin-linux-deps-arm
      - cache-darwin-linux-deps-x86
      - validate-arm
      - validate-x86
      - validate-darwin-warm-rust
      - validate-darwin-cascade-warmup
      - validate-darwin-packages
      - plan-darwin-closures
      - validate-darwin-roots
      - validate-darwin-closures
      - assert-coverage
      - publish
    if: |-
      always() && !cancelled() && contains(needs.*.result, 'failure') &&
      (github.event_name == 'schedule' || github.event_name == 'push' ||
      inputs.repair == true || inputs.repair == 'true') &&
      (inputs.canary_warm_rust != true && inputs.canary_warm_rust != 'true' &&
      inputs.canary_slots == '' && inputs.canary_crates == '')
    # The repair gate runs the Darwin-maintained Python suite, as publish does.
    runs-on: macos-15
    timeout-minutes: 120
    permissions:
      actions: write
      contents: write
      copilot-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/update-runtime
        id: runtime
        with:
          github-token: ${{ secrets.UPDATE_SELF_HEAL_GITHUB_TOKEN }}
          cachix-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          cache-generators: "true"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: ${{ runner.temp }}/repair-evidence
      - name: Collect failed job logs
        env:
          GH_TOKEN: ${{ github.token }}
          NIXCFG_CI_STAGE: collect-evidence
        run: |
          import runpy
          runpy.run_path("lib/update/ci/jobs.py", run_name="__main__")
        shell: python
      - name: Install bounded repair agent
        run: |
          import runpy
          runpy.run_path("lib/update/ci/jobs.py", run_name="__main__")
        shell: python
        env:
          NIXCFG_CI_STAGE: install-agent
      - name: Propose one repair
        env:
          NIXCFG_RUNTIME: ${{ steps.runtime.outputs.runtime }}
          NIXCFG_DEVSHELL: ${{ steps.runtime.outputs.devshell }}
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_MODEL: gpt-6-astra
          COPILOT_AUTO_UPDATE: 'false'
          NIXCFG_CI_STAGE: repair
        run: |
          import runpy
          runpy.run_path("lib/update/ci/jobs.py", run_name="__main__")
