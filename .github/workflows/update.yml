---
name: Update
on:
  workflow_dispatch:
    inputs:
      targets:
        description: Space-separated targets (empty updates all eligible targets)
        type: string
        default: ""
      validate_all_packages:
        description: Validate all declared packages (required for repaired candidates)
        type: boolean
        default: false
      repair:
        description: Allow one agent repair and a fresh fully validated attempt
        type: boolean
        default: true
  schedule:
    - cron: "17 7 * * 1"
  # workflow_dispatch is unavailable to the Cursor GitHub App token
  # (HTTP 403, missing actions:write). Touching .github/update-kick on
  # main or the WIP branch queues one Update run. Prefer
  # `gh workflow run` when the App has Actions write.
  push:
    branches:
      - main
      - copilot/gkzenixcfg-update-automation
    paths:
      - .github/update-kick
permissions:
  contents: read
concurrency:
  group: nixcfg-update-${{ github.ref }}
  # Keep overlapping default-branch runs. Feature-branch exercise runs cancel
  # so a newer HEAD can start instead of waiting on a doomed older SHA.
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}
jobs:
  # Generated artifacts can be shared between platforms. Extend one pinned
  # candidate serially. Linux builds the VM dependencies before Darwin roots.
  prepare-darwin:
    uses: ./.github/workflows/update-native.yml
    with:
      runner: macos-15
      system: aarch64-darwin
      stage: prepare
      targets: ${{ inputs.targets || '' }}
      # workflow_dispatch inputs are unset on push/schedule. A kick-file
      # push must match EM's dispatch: repair (job if) + validate_all.
      validate_all_packages: ${{ github.event_name == 'push' || inputs.validate_all_packages || false }}
    secrets: inherit
  prepare-arm:
    needs: prepare-darwin
    uses: ./.github/workflows/update-native.yml
    with:
      runner: ubuntu-24.04-arm
      system: aarch64-linux
      stage: prepare
      previous: prepare-aarch64-darwin
    secrets: inherit
  prepare-x86:
    needs: prepare-arm
    uses: ./.github/workflows/update-native.yml
    with:
      runner: ubuntu-24.04
      system: x86_64-linux
      stage: prepare
      previous: prepare-aarch64-linux
    secrets: inherit
  # Flake.lock freezes after prepare-darwin. Cache the Linux native boundary
  # of Darwin roots (the Rosetta/linux-builder VM image) here so Darwin
  # closures can start with Darwin packages instead of waiting for Linux
  # package validation. These jobs are not publication evidence.
  cache-darwin-linux-deps-arm:
    needs: prepare-darwin
    uses: ./.github/workflows/update-native.yml
    with:
      runner: ubuntu-24.04-arm
      system: aarch64-linux
      stage: cache-root-deps
      previous: prepare-aarch64-darwin
    secrets: inherit
  cache-darwin-linux-deps-x86:
    needs: prepare-darwin
    uses: ./.github/workflows/update-native.yml
    with:
      runner: ubuntu-24.04
      system: x86_64-linux
      stage: cache-root-deps
      previous: prepare-aarch64-darwin
    secrets: inherit
  validate-arm:
    needs: prepare-x86
    uses: ./.github/workflows/update-native.yml
    with:
      runner: ubuntu-24.04-arm
      system: aarch64-linux
      stage: validate
      previous: prepare-x86_64-linux
    secrets: inherit
  validate-x86:
    needs: prepare-x86
    uses: ./.github/workflows/update-native.yml
    with:
      runner: ubuntu-24.04
      system: x86_64-linux
      stage: validate
      previous: prepare-x86_64-linux
    secrets: inherit
  # Package validation does not need the Linux VM image, so it overlaps the
  # Linux validators. Closures need that image in gkze; the cache-* jobs
  # populate it during later prepare, so this shard no longer waits for
  # Linux package validation. Public macos-15 concurrency is at least 2
  # (run 37090922383 overlapped packages+closures), so these two Darwin
  # jobs run together instead of queuing.
  validate-darwin-packages:
    needs: prepare-x86
    uses: ./.github/workflows/update-native.yml
    with:
      runner: macos-15
      system: aarch64-darwin
      stage: validate
      previous: prepare-x86_64-linux
      scope: packages
    secrets: inherit
  # One macos-15 job cannot both validate every package and realize
  # checks.aarch64-darwin.root-closures inside GitHub's 360-minute cap.
  # Each shard builds until its budget, the Cachix daemon flushes, and the
  # next shard substitutes those paths. The last shard fails closed.
  validate-darwin-closures:
    needs:
      - prepare-x86
      - cache-darwin-linux-deps-arm
      - cache-darwin-linux-deps-x86
    uses: ./.github/workflows/update-native.yml
    with:
      runner: macos-15
      system: aarch64-darwin
      stage: validate
      previous: prepare-x86_64-linux
      scope: closures
      closure_budget_seconds: "18000"
      closure_yield: true
    secrets: inherit
  validate-darwin-closures-2:
    needs: validate-darwin-closures
    if: >-
      always() && !cancelled() &&
      needs.validate-darwin-closures.result == 'success' &&
      needs.validate-darwin-closures.outputs.closure_complete == 'false'
    uses: ./.github/workflows/update-native.yml
    with:
      runner: macos-15
      system: aarch64-darwin
      stage: validate
      previous: prepare-x86_64-linux
      scope: closures
      closure_budget_seconds: "18000"
      closure_yield: true
    secrets: inherit
  validate-darwin-closures-3:
    needs: validate-darwin-closures-2
    if: >-
      always() && !cancelled() &&
      needs.validate-darwin-closures-2.result == 'success' &&
      needs.validate-darwin-closures-2.outputs.closure_complete == 'false'
    uses: ./.github/workflows/update-native.yml
    with:
      runner: macos-15
      system: aarch64-darwin
      stage: validate
      previous: prepare-x86_64-linux
      scope: closures
      closure_budget_seconds: "18000"
      closure_yield: true
    secrets: inherit
  validate-darwin-closures-4:
    needs: validate-darwin-closures-3
    if: >-
      always() && !cancelled() &&
      needs.validate-darwin-closures-3.result == 'success' &&
      needs.validate-darwin-closures-3.outputs.closure_complete == 'false'
    uses: ./.github/workflows/update-native.yml
    with:
      runner: macos-15
      system: aarch64-darwin
      stage: validate
      previous: prepare-x86_64-linux
      scope: closures
      closure_budget_seconds: "18000"
    secrets: inherit
  publish:
    needs:
      - validate-arm
      - validate-x86
      - validate-darwin-packages
      - validate-darwin-closures
      - validate-darwin-closures-2
      - validate-darwin-closures-3
      - validate-darwin-closures-4
    if: >-
      always() && !cancelled() &&
      needs.validate-arm.result == 'success' &&
      needs.validate-x86.result == 'success' &&
      needs.validate-darwin-packages.result == 'success' &&
      (needs.validate-darwin-closures.result == 'success' &&
      needs.validate-darwin-closures.outputs.closure_complete == 'true' ||
      needs.validate-darwin-closures-2.result == 'success' &&
      needs.validate-darwin-closures-2.outputs.closure_complete == 'true' ||
      needs.validate-darwin-closures-3.result == 'success' &&
      needs.validate-darwin-closures-3.outputs.closure_complete == 'true' ||
      needs.validate-darwin-closures-4.result == 'success' &&
      needs.validate-darwin-closures-4.outputs.closure_complete == 'true')
    # The Python suite and its 100% coverage floor are maintained on Darwin.
    runs-on: macos-15
    timeout-minutes: 120
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/update-runtime
        id: runtime
        with:
          github-token: ${{ secrets.UPDATE_SELF_HEAL_GITHUB_TOKEN }}
          cachix-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: ${{ runner.temp }}/evidence
      - name: Certify and check final tree
        id: candidate
        env:
          NIXCFG_RUNTIME: ${{ steps.runtime.outputs.runtime }}
          NIXCFG_DEVSHELL: ${{ steps.runtime.outputs.devshell }}
          NIXCFG_CI_STAGE: certify
        run: |
          import runpy
          runpy.run_path("lib/update/ci/jobs.py", run_name="__main__")
        shell: python
      - uses: crazy-max/ghaction-import-gpg@e89d40939c28e39f97cf32126055eeae86ba74ec # v6
        if: steps.candidate.outputs.changed == 'true'
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true
      - name: Propose validated update
        if: steps.candidate.outputs.changed == 'true'
        env:
          NIXCFG_DEVSHELL: ${{ steps.runtime.outputs.devshell }}
          # The dedicated update PAT is rejected by Git (empty or expired).
          # This job already has contents:write and pull-requests:write.
          GH_TOKEN: ${{ github.token }}
          UPDATE_BASE_BRANCH: ${{ github.event.repository.default_branch }}
          NIXCFG_CI_STAGE: publish
        run: |
          import runpy
          runpy.run_path("lib/update/ci/jobs.py", run_name="__main__")
        shell: python
  repair:
    needs:
      - prepare-darwin
      - prepare-arm
      - prepare-x86
      - cache-darwin-linux-deps-arm
      - cache-darwin-linux-deps-x86
      - validate-arm
      - validate-x86
      - validate-darwin-packages
      - validate-darwin-closures
      - validate-darwin-closures-2
      - validate-darwin-closures-3
      - validate-darwin-closures-4
      - publish
    if: |-
      always() && !cancelled() && contains(needs.*.result, 'failure') &&
      (github.event_name == 'schedule' || github.event_name == 'push' ||
      inputs.repair == true || inputs.repair == 'true')
    # The repair gate runs the Darwin-maintained Python suite, as publish does.
    runs-on: macos-15
    timeout-minutes: 120
    permissions:
      actions: write
      contents: write
      copilot-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/update-runtime
        id: runtime
        with:
          github-token: ${{ secrets.UPDATE_SELF_HEAL_GITHUB_TOKEN }}
          cachix-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          cache-generators: "true"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: ${{ runner.temp }}/repair-evidence
      - name: Collect failed job logs
        env:
          GH_TOKEN: ${{ github.token }}
          NIXCFG_CI_STAGE: collect-evidence
        run: |
          import runpy
          runpy.run_path("lib/update/ci/jobs.py", run_name="__main__")
        shell: python
      - name: Install bounded repair agent
        run: |
          import runpy
          runpy.run_path("lib/update/ci/jobs.py", run_name="__main__")
        shell: python
        env:
          NIXCFG_CI_STAGE: install-agent
      - name: Propose one repair
        env:
          NIXCFG_RUNTIME: ${{ steps.runtime.outputs.runtime }}
          NIXCFG_DEVSHELL: ${{ steps.runtime.outputs.devshell }}
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_MODEL: gpt-6-astra
          COPILOT_AUTO_UPDATE: 'false'
          NIXCFG_CI_STAGE: repair
        run: |
          import runpy
          runpy.run_path("lib/update/ci/jobs.py", run_name="__main__")
        shell: python
      - name: Retain repair evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: repair
          path: |
            ${{ runner.temp }}/repair.patch
            ${{ runner.temp }}/repair-evidence/repair.log
          if-no-files-found: warn
          overwrite: true
          retention-days: 30
      - uses: crazy-max/ghaction-import-gpg@e89d40939c28e39f97cf32126055eeae86ba74ec # v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true
      - name: Start a fresh attempt with repair disabled
        env:
          NIXCFG_DEVSHELL: ${{ steps.runtime.outputs.devshell }}
          GH_TOKEN: ${{ github.token }}
          NIXCFG_CI_STAGE: start-repair
          NIXCFG_UPDATE_TARGETS: ${{ inputs.targets || '' }}
        run: |
          import runpy
          runpy.run_path("lib/update/ci/jobs.py", run_name="__main__")
        shell: python
