---
name: Native update stage
on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      system:
        required: true
        type: string
      stage:
        required: true
        type: string
      previous:
        default: ""
        type: string
      validate_all_packages:
        default: false
        type: boolean
      targets:
        default: ""
        type: string
    secrets:
      UPDATE_SELF_HEAL_GITHUB_TOKEN:
        required: true
      CACHIX_AUTH_TOKEN:
        required: true
permissions:
  contents: read
jobs:
  native:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/update-runtime
        id: runtime
        with:
          github-token: ${{ secrets.UPDATE_SELF_HEAL_GITHUB_TOKEN }}
          cachix-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          cache-generators: ${{ inputs.stage == 'prepare' }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        if: inputs.previous != ''
        with:
          name: ${{ inputs.previous }}
          path: ${{ runner.temp }}/previous
      - name: Prepare or validate candidate
        env:
          NIXCFG_RUNTIME: ${{ steps.runtime.outputs.runtime }}
          NIXCFG_DEVSHELL: ${{ steps.runtime.outputs.devshell }}
          NIXCFG_UPDATE_TARGETS: ${{ inputs.targets }}
          NIXCFG_VALIDATE_ALL_PACKAGES: ${{ inputs.validate_all_packages }}
          NIXCFG_PREVIOUS_CANDIDATE: |-
            ${{ inputs.previous != '' &&
            format('{0}/previous/candidate.json', runner.temp) || '' }}
          GITHUB_TOKEN: ${{ secrets.UPDATE_SELF_HEAL_GITHUB_TOKEN }}
          NIXCFG_CI_STAGE: ${{ inputs.stage }}
        run: |
          import runpy
          runpy.run_path("lib/update/ci/jobs.py", run_name="__main__")
        shell: python
      - name: Retain candidate and failure evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ inputs.stage }}-${{ inputs.system }}
          path: ${{ runner.temp }}/update-artifacts
          if-no-files-found: warn
          overwrite: true
          retention-days: 30
