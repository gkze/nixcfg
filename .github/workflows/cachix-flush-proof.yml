---
# Deliberate failure after a unique store path is pushed. The proof job is
# the required check: the designed fail step exits 1, and gkze.cachix.org
# must still have the path. continue-on-error is only on that designed
# fail step. The job conclusion stays green only when flush and the
# cachix-action post hook both succeed; a post-hook throw (missing pid
# after a drained daemon) fails the job and this workflow.
name: Cachix flush proof
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fail-after-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/update-runtime
        id: runtime
        with:
          github-token: ${{ secrets.UPDATE_SELF_HEAL_GITHUB_TOKEN }}
          cachix-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Require Cachix daemon socket
        run: |
          import os
          from pathlib import Path

          daemon_dir = os.environ.get("CACHIX_DAEMON_DIR", "")
          socket_env = os.environ.get("CACHIX_DAEMON_SOCKET", "")
          socket = Path(socket_env) if socket_env else (
              Path(daemon_dir) / "daemon.sock" if daemon_dir else None
          )
          if socket is None:
              raise SystemExit(
                  "CACHIX_DAEMON_DIR and CACHIX_DAEMON_SOCKET are unset; "
                  "useDaemon did not start"
              )
          if not socket.exists():
              raise SystemExit(f"Cachix daemon socket missing: {socket}")
          print(f"daemon socket {socket}")
        shell: python
      - name: Realize a unique path and fail
        continue-on-error: true
        env:
          PROOF_NAME: cachix-flush-proof-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          import os
          import subprocess
          from pathlib import Path

          name = os.environ["PROOF_NAME"]
          cwd = Path.cwd()
          expr = (
              "let pkgs = (builtins.getFlake "
              f'"path:{cwd}").pkgs.x86_64-linux; '
              f'in pkgs.runCommand "{name}" {{}} "echo {name} > $out"'
          )
          built = subprocess.check_output(
              [
                  "nix",
                  "build",
                  "--impure",
                  "--no-link",
                  "--print-out-paths",
                  "--expr",
                  expr,
              ],
              text=True,
          ).strip()
          Path(os.environ["RUNNER_TEMP"], "proof-path.txt").write_text(built + "\n")
          raise SystemExit(1)
        shell: python
      - name: Realize a post-failure path
        if: always()
        env:
          PROOF_NAME: cachix-flush-proof-after-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          import os
          import subprocess
          from pathlib import Path

          name = os.environ["PROOF_NAME"]
          cwd = Path.cwd()
          expr = (
              "let pkgs = (builtins.getFlake "
              f'"path:{cwd}").pkgs.x86_64-linux; '
              f'in pkgs.runCommand "{name}" {{}} "echo {name} > $out"'
          )
          built = subprocess.check_output(
              [
                  "nix",
                  "build",
                  "--impure",
                  "--no-link",
                  "--print-out-paths",
                  "--expr",
                  expr,
              ],
              text=True,
          ).strip()
          Path(os.environ["RUNNER_TEMP"], "proof-path-after.txt").write_text(
              built + "\n"
          )
        shell: python
      - name: Retain proof path
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cachix-flush-proof
          path: |
            ${{ runner.temp }}/proof-path.txt
            ${{ runner.temp }}/proof-path-after.txt
          if-no-files-found: error
      - name: Flush Cachix daemon
        if: always()
        env:
          NIXCFG_CI_STAGE: flush-cachix
        run: |
          import runpy
          runpy.run_path("lib/update/ci/jobs.py", run_name="__main__")
        shell: python
  assert-partial:
    needs: fail-after-push
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/update-runtime
        id: runtime
        with:
          github-token: ${{ secrets.UPDATE_SELF_HEAL_GITHUB_TOKEN }}
          cachix-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: cachix-flush-proof
          path: ${{ runner.temp }}/proof
      - name: Require the failed job's path in Cachix
        run: |
          import subprocess
          from pathlib import Path
          import os

          evidence = Path(os.environ["RUNNER_TEMP"]) / "proof"
          before = (evidence / "proof-path.txt").read_text().strip()
          after = (evidence / "proof-path-after.txt").read_text().strip()
          for label, path in (("before-failure", before), ("after-failure", after)):
              if not path.startswith("/nix/store/"):
                  raise SystemExit(f"invalid {label} proof path: {path}")
              subprocess.run(
                  ["nix", "path-info", "--store", "https://gkze.cachix.org", path],
                  check=True,
              )
              print(f"partial Cachix presence proved for {label} {path}")
        shell: python
      - name: Flush Cachix daemon
        if: always()
        env:
          NIXCFG_CI_STAGE: flush-cachix
        run: |
          import runpy
          runpy.run_path("lib/update/ci/jobs.py", run_name="__main__")
        shell: python
  proof:
    needs:
      - fail-after-push
      - assert-partial
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    steps:
      - name: Require designed failure plus Cachix hit
        shell: python
        run: |-
          # continue-on-error is only on the designed fail step. The job
          # conclusion is success only when flush and the cachix-action
          # post hook both succeed. A post-hook throw fails this job.
          failed = "${{ needs.fail-after-push.result }}"
          proved = "${{ needs.assert-partial.result }}"
          if failed != "success" or proved != "success":
              raise SystemExit(f"proof job results: fail={failed} assert={proved}")
