---
# Trusted events deliberately fail after a unique store path is pushed. The
# proof job is the required check: the designed fail step exits 1, and
# gkze.cachix.org must still have the path. A third path is built into a
# SIGSTOPped daemon so flush must time out `daemon stop` and republish it from
# the store. Fork PRs instead run a read-only cache proof with no upload
# credential. continue-on-error is only on the designed fail step. The trusted
# job conclusion stays green only when flush and the cachix-action post hook
# both succeed; a post-hook throw (missing pid after a drained daemon) fails it.
name: Cachix flush proof
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fail-after-push:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/update-runtime
        id: runtime
        with:
          github-token: ${{ secrets.UPDATE_SELF_HEAL_GITHUB_TOKEN }}
          cachix-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Require Cachix daemon socket
        run: |
          import os
          from pathlib import Path

          daemon_dir = os.environ.get("CACHIX_DAEMON_DIR", "")
          socket_env = os.environ.get("CACHIX_DAEMON_SOCKET", "")
          socket = Path(socket_env) if socket_env else (
              Path(daemon_dir) / "daemon.sock" if daemon_dir else None
          )
          if socket is None:
              raise SystemExit(
                  "CACHIX_DAEMON_DIR and CACHIX_DAEMON_SOCKET are unset; "
                  "useDaemon did not start"
              )
          if not socket.exists():
              raise SystemExit(f"Cachix daemon socket missing: {socket}")
          print(f"daemon socket {socket}")
        shell: python
      - name: Realize a unique path and fail
        continue-on-error: true
        env:
          PROOF_NAME: cachix-flush-proof-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          import os
          import subprocess
          from pathlib import Path

          name = os.environ["PROOF_NAME"]
          cwd = Path.cwd()
          expr = (
              "let pkgs = (builtins.getFlake "
              f'"path:{cwd}").pkgs.x86_64-linux; '
              f'in pkgs.runCommand "{name}" {{}} "echo {name} > $out"'
          )
          built = subprocess.check_output(
              [
                  "nix",
                  "build",
                  "--impure",
                  "--no-link",
                  "--print-out-paths",
                  "--expr",
                  expr,
              ],
              text=True,
          ).strip()
          Path(os.environ["RUNNER_TEMP"], "proof-path.txt").write_text(built + "\n")
          raise SystemExit(1)
        shell: python
      - name: Realize a post-failure path
        if: always()
        env:
          PROOF_NAME: cachix-flush-proof-after-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          import os
          import subprocess
          from pathlib import Path

          name = os.environ["PROOF_NAME"]
          cwd = Path.cwd()
          expr = (
              "let pkgs = (builtins.getFlake "
              f'"path:{cwd}").pkgs.x86_64-linux; '
              f'in pkgs.runCommand "{name}" {{}} "echo {name} > $out"'
          )
          built = subprocess.check_output(
              [
                  "nix",
                  "build",
                  "--impure",
                  "--no-link",
                  "--print-out-paths",
                  "--expr",
                  expr,
              ],
              text=True,
          ).strip()
          Path(os.environ["RUNNER_TEMP"], "proof-path-after.txt").write_text(
              built + "\n"
          )
        shell: python
      # 40048292663: a wedged daemon dropped queued paths and `daemon stop`
      # never returned. SIGSTOP reproduces both: the hook's push only lands
      # in the socket backlog, and stop gets no reply. Flush must time stop
      # out, kill the daemon, and republish this path from the local store.
      - name: Wedge the daemon and realize a queued path
        if: always()
        env:
          PROOF_NAME: cachix-flush-proof-wedged-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          import os
          import signal
          import subprocess
          from pathlib import Path

          daemon = Path(os.environ["CACHIX_DAEMON_DIR"]) / "daemon.pid"
          os.kill(int(daemon.read_text().strip()), signal.SIGSTOP)
          name = os.environ["PROOF_NAME"]
          cwd = Path.cwd()
          expr = (
              "let pkgs = (builtins.getFlake "
              f'"path:{cwd}").pkgs.x86_64-linux; '
              f'in pkgs.runCommand "{name}" {{}} "echo {name} > $out"'
          )
          built = subprocess.check_output(
              [
                  "nix",
                  "build",
                  "--impure",
                  "--no-link",
                  "--print-out-paths",
                  "--expr",
                  expr,
              ],
              text=True,
          ).strip()
          Path(os.environ["RUNNER_TEMP"], "proof-path-wedged.txt").write_text(
              built + "\n"
          )
        shell: python
      - name: Retain proof path
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cachix-flush-proof
          path: |
            ${{ runner.temp }}/proof-path.txt
            ${{ runner.temp }}/proof-path-after.txt
            ${{ runner.temp }}/proof-path-wedged.txt
          if-no-files-found: error
      # Flush stays the last step; the same step then proves it took the
      # wedged-daemon recovery rather than a normal drain.
      - name: Flush Cachix daemon
        if: always()
        timeout-minutes: 15
        env:
          NIXCFG_CI_STAGE: flush-cachix
          NIXCFG_CACHIX_STOP_TIMEOUT_SECONDS: "30"
        run: |
          import os
          import runpy
          from pathlib import Path

          try:
              runpy.run_path("lib/update/ci/jobs.py", run_name="__main__")
          except SystemExit as exit_:
              if exit_.code not in (0, None):
                  raise
          log = (
              Path(os.environ["RUNNER_TEMP"]) / "update-artifacts" / "cachix-flush.log"
          ).read_text()
          for needle in (
              "cachix daemon stop returncode=124",
              "wedged Cachix daemon pid=",
              "locally built paths on gkze.cachix.org or cache.nixos.org",
          ):
              if needle not in log:
                  raise SystemExit(f"flush did not take the wedge recovery: {needle!r}")
        shell: python
  fork-read-only:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/update-runtime
        id: runtime
        with:
          github-token: ${{ github.token }}
          cachix-token: ""
      - name: Validate read-only Cachix access
        shell: python
        run: |
          import subprocess

          # Fork PRs must prove cache reads without receiving an upload token
          # or realizing a unique path that would require a write proof.
          subprocess.run(
              ["nix", "store", "ping", "--store", "https://gkze.cachix.org"],
              check=True,
          )
      - name: Flush Cachix daemon
        if: always()
        env:
          NIXCFG_CI_STAGE: flush-cachix
        run: |
          import runpy
          runpy.run_path("lib/update/ci/jobs.py", run_name="__main__")
        shell: python
  assert-partial:
    needs: fail-after-push
    if: >-
      always() && !cancelled() &&
      (github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/update-runtime
        id: runtime
        with:
          github-token: ${{ secrets.UPDATE_SELF_HEAL_GITHUB_TOKEN }}
          cachix-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: cachix-flush-proof
          path: ${{ runner.temp }}/proof
      - name: Require the failed job's path in Cachix
        run: |
          import subprocess
          from pathlib import Path
          import os

          evidence = Path(os.environ["RUNNER_TEMP"]) / "proof"
          before = (evidence / "proof-path.txt").read_text().strip()
          after = (evidence / "proof-path-after.txt").read_text().strip()
          wedged = (evidence / "proof-path-wedged.txt").read_text().strip()
          for label, path in (
              ("before-failure", before),
              ("after-failure", after),
              ("wedged-daemon", wedged),
          ):
              if not path.startswith("/nix/store/"):
                  raise SystemExit(f"invalid {label} proof path: {path}")
              subprocess.run(
                  ["nix", "path-info", "--store", "https://gkze.cachix.org", path],
                  check=True,
              )
              print(f"partial Cachix presence proved for {label} {path}")
        shell: python
      - name: Flush Cachix daemon
        if: always()
        timeout-minutes: 15
        env:
          NIXCFG_CI_STAGE: flush-cachix
        run: |
          import runpy
          runpy.run_path("lib/update/ci/jobs.py", run_name="__main__")
        shell: python
  proof:
    needs:
      - fail-after-push
      - fork-read-only
      - assert-partial
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    steps:
      - name: Require trusted write or fork read proof
        shell: python
        run: |-
          # Trusted events require the designed write failure and Cachix hit.
          # Fork PRs instead require the meaningful read-only proof, so this
          # aggregate required check has a successful outcome on either path.
          trusted = "${{ github.event_name == 'workflow_dispatch' }}" == "true"
          if not trusted:
              trusted = (
                  "${{ github.event.pull_request.head.repo.full_name == github.repository }}"
                  == "true"
              )
          failed = "${{ needs.fail-after-push.result }}"
          fork_read = "${{ needs.fork-read-only.result }}"
          proved = "${{ needs.assert-partial.result }}"
          if trusted and (failed != "success" or proved != "success"):
              raise SystemExit(f"write proof job results: fail={failed} assert={proved}")
          if not trusted and fork_read != "success":
              raise SystemExit(f"fork read-only proof result: {fork_read}")
