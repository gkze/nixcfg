---
# Deliberate failure after a unique store path is pushed. The proof job is
# the required check: the builder must fail and gkze.cachix.org must still
# have the path. continue-on-error keeps the workflow conclusion green so
# this is evidence, not a merge blocker.
name: Cachix flush proof
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fail-after-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/update-runtime
        id: runtime
        with:
          github-token: ${{ secrets.UPDATE_SELF_HEAL_GITHUB_TOKEN }}
          cachix-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Realize a unique path and fail
        env:
          PROOF_NAME: cachix-flush-proof-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          import os
          import subprocess
          from pathlib import Path

          name = os.environ["PROOF_NAME"]
          cwd = Path.cwd()
          expr = (
              "let pkgs = (builtins.getFlake "
              f'"path:{cwd}").pkgs.x86_64-linux; '
              f'in pkgs.runCommand "{name}" {{}} "echo {name} > $out"'
          )
          built = subprocess.check_output(
              [
                  "nix",
                  "build",
                  "--impure",
                  "--no-link",
                  "--print-out-paths",
                  "--expr",
                  expr,
              ],
              text=True,
          ).strip()
          Path(os.environ["RUNNER_TEMP"], "proof-path.txt").write_text(built + "\n")
          raise SystemExit(1)
        shell: python
      - name: Flush Cachix daemon
        if: always()
        env:
          NIXCFG_CI_STAGE: flush-cachix
        run: |
          import runpy
          runpy.run_path("lib/update/ci/jobs.py", run_name="__main__")
        shell: python
      - name: Retain proof path
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cachix-flush-proof
          path: ${{ runner.temp }}/proof-path.txt
          if-no-files-found: error
  assert-partial:
    needs: fail-after-push
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/update-runtime
        id: runtime
        with:
          github-token: ${{ secrets.UPDATE_SELF_HEAL_GITHUB_TOKEN }}
          cachix-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: cachix-flush-proof
          path: ${{ runner.temp }}/proof
      - name: Require the failed job's path in Cachix
        run: |
          import subprocess
          from pathlib import Path
          import os

          path = (Path(os.environ["RUNNER_TEMP"]) / "proof" / "proof-path.txt").read_text().strip()
          if not path.startswith("/nix/store/"):
              raise SystemExit(f"invalid proof path: {path}")
          subprocess.run(
              ["nix", "path-info", "--store", "https://gkze.cachix.org", path],
              check=True,
          )
          print(f"partial Cachix presence proved for {path}")
        shell: python
  proof:
    needs:
      - fail-after-push
      - assert-partial
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    steps:
      - name: Require designed failure plus Cachix hit
        shell: python
        run: |
          # continue-on-error on fail-after-push reports success to needs
          # after the job failed. The proof we need is assert-partial green
          # plus the uploaded unique path. The fail step's exit 1 is in the
          # job log (ED-1.1).
          failed = "${{ needs.fail-after-push.result }}"
          proved = "${{ needs.assert-partial.result }}"
          if failed != "success" or proved != "success":
              raise SystemExit(f"proof job results: fail={failed} assert={proved}")
