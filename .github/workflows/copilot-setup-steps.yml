---
name: Copilot development environment
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - .github/actions/update-runtime/action.yml
permissions:
  contents: read
jobs:
  copilot-setup-steps:
    runs-on: ubuntu-24.04
    timeout-minutes: 59
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Prepare pinned Nix and Python tooling
        id: runtime
        uses: ./.github/actions/update-runtime
        with:
          github-token: ${{ github.token }}
          cache-generators: 'true'
      - name: Verify development tools and retain environment references
        shell: python
        env:
          NIXCFG_RUNTIME: ${{ steps.runtime.outputs.runtime }}
          NIXCFG_DEVSHELL: ${{ steps.runtime.outputs.devshell }}
          GH_TOKEN: ${{ github.token }}
        run: |-
          import os
          import subprocess
          from pathlib import Path

          subprocess.run([
              'nix', 'develop', os.environ['NIXCFG_DEVSHELL'], '--command',
              'python', '-c',
              'import sys, dbos, pytest, coverage, nix_manipulator; '
              'assert sys.version_info >= (3, 14); print(sys.version)',
          ], check=True)
          subprocess.run([os.environ['NIXCFG_RUNTIME'] + '/bin/nixcfg', '--help'], check=True)
          subprocess.run(['gh', 'api', 'repos/gkze/nixcfg', '--jq', '.full_name'], check=True)
          with Path(os.environ['GITHUB_ENV']).open('a') as output:
              for name in ('NIXCFG_RUNTIME', 'NIXCFG_DEVSHELL'):
                  output.write(f'{name}={os.environ[name]}\n')
