[build-system]
# Ensure packaging uses setuptools at a known minimum version.
requires = ["setuptools>=82.0.0"]
# Use setuptools' PEP 517 backend for builds and installs.
build-backend = "setuptools.build_meta"

[project]
# Publish package metadata under this distribution name.
name = "nixcfg"
# Keep a local placeholder version for this tooling package.
version = "0.0.0"
# Describe the package purpose in distribution metadata.
description = "nixcfg"
# Align all tooling behavior to Python 3.14+ language features.
requires-python = ">=3.14"
# Install runtime libraries required by nixcfg commands.
dependencies = [
  "aiohttp>=3.13.3",
  "beautifulsoup4>=4.14.2",
  "defusedxml>=0.7.1",
  "deepdiff>=8.6.1",
  "filelock>=3.24.3",
  "httpx>=0.28.1",
  "isort>=8.0.1",
  "keyring>=25.7.0",
  "libcst>=1.8.6",
  "lz4>=4.4.5",
  "nix-manipulator",
  "node-semver>=0.9.1,<1",
  "packaging>=26.0",
  "pydantic-settings>=2.13.1",
  "pydantic>=2.12.5",
  "pyyaml>=6.0.3",
  "rich>=14.3.3",
  "tree-sitter>=0.25.2,<0.26",
  "tenacity>=9.1.4",
  "tomlkit>=0.14.0",
  "typer>=0.24.1",
  "githubkit>=0.15.1",
]

[project.scripts]
# Expose `nixcfg` as a CLI command from the `nixcfg:main` entrypoint.
nixcfg = "nixcfg:main"

[project.optional-dependencies]
# Install these only for schema/code-generation workflows.
codegen = ["datamodel-code-generator[http]>=0.54.0", "referencing>=0.37.0"]

[tool.ruff]
# Turn on Ruff preview behavior to adopt newer checks earlier.
preview = true
# Apply excludes even when editors or manual commands pass explicit file paths.
force-exclude = true
# Treat these directories as namespace package roots during resolution.
namespace-packages = ["overlays", "packages"]
# Explicitly include all extensionless Python entrypoints in Ruff discovery.
extend-include = ["home/george/bin/git-ignore", "home/george/bin/zentool"]

[tool.ruff.format]
# Ruff 0.15.x can de-parenthesize multi-exception handlers into invalid Python
# 2-era syntax on these entrypoints and helper modules; keep this list aligned
# with lib/lint-files.nix and do not format them until the upstream formatter
# bug is fixed.
exclude = [
  "home/george/bin/git-ignore",
  "home/george/bin/zentool",
  "lib/crate2nix_tauri_env_rewrite.py",
  "lib/nix/schemas/_fetch.py",
  "lib/update/persistence.py",
  "lib/update/updaters/_sourcefile.py",
  "packages/sculptor/updater.py",
]

[tool.ruff.lint]
# Start from the full Ruff rule set.
select = ["ALL"]
# Keep formatter/docstyle convention conflicts and repo-wide policy migrations
# out of the active set. Copyright headers and collection-literal wrapping need
# deliberate adoption rather than appearing implicitly after a Ruff upgrade.
ignore = ["COM812", "CPY001", "D203", "D213", "ISC004"]
# Enable preview lint rules in addition to stable rules.
preview = true
# Require explicit preview rule codes to avoid accidental prefix selection.
explicit-preview-rules = true

[tool.ruff.lint.per-file-ignores]
# Keep high-signal linting in tests while allowing pragmatic test patterns.
"{lib/tests/**/*.py,packages/*/updater_test.py,overlays/*/updater_test.py}" = [
  "ANN001",
  "ANN002",
  "ANN003",
  "ANN202",
  "ARG001",
  "ARG005",
  "ASYNC109",
  "ASYNC240",
  "D102",
  "D103",
  "D105",
  "D107",
  "EM101",
  "E501",
  "FBT001",
  "FLY002",
  "PERF401",
  "PLC0415",
  "PLR2004",
  "PLW0108",
  "PYI034",
  "RUF043",
  "S101",
  "S108",
  "SLF001",
  "TC003",
  "TRY003",
  "TRY004",
]
[tool.ruff.lint.isort]
# Classify these imports as first-party for stable import ordering.
known-first-party = ["lib", "nixcfg"]

[tool.ruff.lint.pycodestyle]
# Allow lines up to 100 chars before E501-style diagnostics trigger.
max-line-length = 100

[tool.ruff.lint.mccabe]
# Permit moderate control-flow complexity in orchestration code.
max-complexity = 20

[tool.ruff.lint.pylint]
# Allow wider function signatures used by CLI and integration surfaces.
max-args = 25
# Allow moderate branching in command and pipeline handlers.
max-branches = 20
# Allow a few early-return paths in command orchestration.
max-returns = 7

[tool.uv]
# Mark this repository as an installable package project for uv.
package = true

[tool.uv.sources]
# Pin `nix-manipulator` to a specific git revision for deterministic resolution.
nix-manipulator = { git = "https://github.com/hoh/nix-manipulator.git", rev = "dbe47853d2f48b6314a9e07e5bad6ba78bdbf6bc" }

[tool.setuptools]
# Ship the top-level `nixcfg.py` module as a distributable module.
py-modules = ["nixcfg"]

[tool.setuptools.packages.find]
# Include package directories rooted under `lib`.
include = ["lib*"]
# Keep repository-only tests out of installed runtime artifacts.
exclude = ["lib.tests*"]

[tool.setuptools.package-data]
# Ship the cross-language system policy beside ``lib.system_policy``.
"lib" = ["system-policy.json"]
# Ship the type marker and schemas owned by the Nix model/codegen package.
"lib.nix" = ["py.typed"]
"lib.nix.schemas" = ["*.yaml", "_version.json"]

[tool.nixcfg.runtimeSource]
# Keep the updater re-exec boundary aligned with the uv2nix workspace source.
schemaVersion = 1
rootPaths = ["nixcfg.py", "pyproject.toml", "uv.lock"]
libraryExtensions = ["json", "py", "pyi", "yaml"]
libraryNames = ["py.typed"]
excludedLibraryPaths = ["tests"]
dynamicRoots = ["packages", "overlays"]
dynamicExtensions = ["py", "pyi", "zig"]
dynamicExcludedFileSuffixes = ["_test.py"]

[tool.ty.src]
# Restrict Ty analysis to maintained source trees and explicit extensionless Python entrypoints.
include = [
  "nixcfg.py",
  "lib/**/*.py",
  "lib/**/*.pyi",
  "overlays/**/*.py",
  "overlays/**/*.pyi",
  "packages/**/*.py",
  "packages/**/*.pyi",
  "modules/**/*.py",
  "modules/**/*.pyi",
  "home/george/bin/git-ignore",
  "home/george/bin/zentool",
]

[tool.ty.rules]
# Treat all Ty diagnostics as errors.
all = "error"
# Keep newly introduced preview-style strictness opt-in until the codebase is
# migrated deliberately.
missing-override-decorator = "ignore"
missing-type-argument = "ignore"
unsound-assignment = "ignore"
unsound-return-statement = "ignore"

[[tool.ty.overrides]]
# Dynamic mocks and deliberately invalid fixtures exercise runtime failure
# contracts. Ignore only the diagnostic families those test seams require;
# every other Ty rule remains enabled for tests.
include = [
  "lib/tests/**/*.py",
  "packages/*/updater_test.py",
  "overlays/*/updater_test.py",
]

[tool.ty.overrides.rules]
invalid-argument-type = "ignore"
invalid-key = "ignore"
invalid-method-override = "ignore"
invalid-return-type = "ignore"
missing-argument = "ignore"
missing-typed-dict-key = "ignore"
not-iterable = "ignore"
not-subscriptable = "ignore"
unknown-argument = "ignore"
unresolved-attribute = "ignore"
unsupported-operator = "ignore"

[tool.ty.terminal]
# Return non-zero when Ty emits warnings.
error-on-warning = true

[tool.ty.analysis]
# Require explicit `ty: ignore` suppressions by not honoring `type: ignore`.
respect-type-ignore-comments = false

[tool.pytest.ini_options]
# Enforce strict validation of pytest config keys and marker declarations.
addopts = ["--strict-config", "--strict-markers", "--import-mode=importlib"]
# Discover shared tests plus package- and overlay-owned sibling updater tests.
testpaths = ["lib", "packages", "overlays"]
# Preserve pytest's conventional prefix while supporting colocated sibling names.
python_files = ["test_*.py", "*_test.py"]
# Fail when xfail-marked tests unexpectedly pass.
xfail_strict = true

[tool.coverage.run]
# Measure branch coverage in addition to line coverage.
branch = true
# Measure the currently enforced Python surfaces for coverage.
source = ["nixcfg", "lib", "modules", "packages", "overlays", "home/george/bin"]

[tool.coverage.report]
# Require at least this total coverage percentage. The floor stays at 100%;
# deliberate exclusions must be visible in the diff instead of hiding in a
# lower number.
fail_under = 100
# Exclude test modules from coverage totals.
omit = [
  "lib/tests/*",
  "packages/*/updater_test.py",
  "overlays/*/updater_test.py",
]
# Show exact missing lines in text coverage reports.
show_missing = true
# Replace the default bare-pragma with a reason-required form: only
# `# pragma: no cover -- <reason>` excludes a line, so every exclusion
# carries a reviewable justification. Reserve it for defensive/unreachable
# branches where a test would only restate the implementation. Setting
# exclude_lines replaces coverage's defaults, so the non-pragma defaults
# (ellipsis stubs, TYPE_CHECKING blocks) are restated here verbatim.
exclude_lines = [
  '# pragma: no cover -- \S',
  '^\s*(((async )?def .*?)?\)(\s*->.*?)?:\s*)?\.\.\.\s*(#|$)',
  'if (typing\.)?TYPE_CHECKING:',
]
# Same rule for partial-branch exclusions (no non-pragma defaults to restate).
partial_branches = ['# pragma: no branch -- \S']

[dependency-groups]
# Install these tools only for local development and quality checks.
dev = [
  "cosmic-ray>=8.3.18",
  "coverage>=7.13.4",
  "datamodel-code-generator[http]>=0.54.0",
  "pytest>=9.0.2",
  "pytest-xdist>=3.8.0",
  "tree-sitter>=0.25.2,<0.26",
  "tree-sitter-bash>=0.25.0",
  "pyupgrade>=3.21.2",
  "referencing>=0.37.0",
  "ruff>=0.15.2",
  "ty>=0.0.18",
]
