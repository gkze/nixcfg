[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "nixcfg-unsloth-runtime"
version = "0.0.0"
requires-python = "==3.12.*"
dependencies = [
  "unsloth[studio] @ https://files.pythonhosted.org/packages/d0/57/ff53f570f7641218eb969137f5eea2dbf8c5b951893498881ebd9ab7942c/unsloth-2026.9.2.tar.gz",
]

[tool.uv]
environments = [
  "sys_platform == 'darwin' and platform_machine == 'arm64' and python_version == '3.12'",
]
override-dependencies = [
  "triton>=3.0.0 ; sys_platform == 'linux'",
  "xformers>=0.0.27.post2 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
required-environments = [
  "sys_platform == 'darwin' and platform_machine == 'arm64' and python_version == '3.12'",
]

[tool.setuptools]
py-modules = []
