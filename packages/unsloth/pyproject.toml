[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "nixcfg-unsloth-runtime"
version = "0.0.0"
requires-python = "==3.12.*"
dependencies = [
  "unsloth[studio] @ https://github.com/unslothai/unsloth/archive/e680e303ea5374372aa4d66b1f02b747899740bb.tar.gz",
]

[tool.uv]
environments = [
  "sys_platform == 'darwin' and platform_machine == 'arm64' and python_version == '3.12'",
]
override-dependencies = [
  "triton>=3.0.0 ; sys_platform == 'linux'",
  "xformers>=0.0.27.post2 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
required-environments = [
  "sys_platform == 'darwin' and platform_machine == 'arm64' and python_version == '3.12'",
]

[tool.setuptools]
py-modules = []
